# Blueprint do Render: cria a API como serviço web. No Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    name: painel-ativos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: bash iniciar.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # origens que podem chamar a API pelo navegador (separe por vírgula)
      - key: CORS_ORIGINS
        value: https://painel-ativos-web.onrender.com,https://projetoaplicado2.vercel.app,http://localhost:5173
      # aceita também o site do Render (mesmo se o endereço ganhar sufixo) e os previews da Vercel
      - key: CORS_ORIGIN_REGEX
        value: https://painel-ativos-web.*\.onrender\.com|https://(projetoaplicado2|projeto-aplicado-ii).*\.vercel\.app
      # 1 = um simulador envia leituras novas continuamente (demonstração); 0 = só os dados iniciais
      - key: SIMULAR
        value: "1"

  # Front (React + Vite) como site estático, na mesma conta do Render
  - type: web
    name: painel-ativos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # endereço público da API (entra no build do front)
      - key: VITE_API_URL
        value: https://painel-ativos-api.onrender.com
