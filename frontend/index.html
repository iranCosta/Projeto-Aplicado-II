<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel de Saúde dos Ativos — motores e compressores, alertas e histórico de anomalias." />
    <title>Painel de Saúde dos Ativos — ArcelorMittal Tuper</title>
    <script>
      // aplica o tema salvo antes de desenhar, para não piscar
      try {
        var t = localStorage.getItem("tema");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
